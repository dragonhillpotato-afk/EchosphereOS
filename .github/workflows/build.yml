
name: EchosphereOS Debian Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: node:20-trixie

    timeout-minutes: 90

    steps:
      - name: Checkout EchosphereOS
        uses: actions/checkout@v4

      - name: Install Debian build tools
        run: |
          apt-get update
          apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Configure EchosphereOS
        run: |
          mkdir -p config/package-lists
          echo "task-xfce-desktop live-boot live-config" > config/package-lists/echosphere.list.chroot

          lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-image iso-hybrid \
            --archive-areas "main"

      - name: Build EchosphereOS
        run: |
          set -o pipefail
          lb build 2>&1 | tee build.log

      - name: Upload EchosphereOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: EchosphereOS-ISO
          path: "*.hybrid.iso"
          if-no-files-found: error
