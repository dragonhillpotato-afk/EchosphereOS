
name: EchosphereOS ISO Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout EchosphereOS
        uses: actions/checkout@v4

      - name: Build inside official Debian Trixie
        run: |
          docker run --privileged --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            debian:trixie \
            bash -euxo pipefail -c '
              apt-get update

              apt-get install -y \
                live-build \
                debootstrap \
                debian-archive-keyring \
                squashfs-tools \
                xorriso \
                grub-pc-bin \
                grub-efi-amd64-bin \
                mtools \
                dosfstools

              mkdir -p config/package-lists

              echo "task-xfce-desktop firefox-esr network-manager sudo curl git live-boot live-config" \
                > config/package-lists/echosphere.list.chroot

              lb config \
                --distribution trixie \
                --architectures amd64 \
                --linux-packages linux-image \
                --binary-image iso-hybrid \
                --archive-areas main

              lb build
            '

      - name: Upload EchosphereOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: EchosphereOS-ISO
          path: "*.hybrid.iso"
          if-no-files-found: error
