
name: EchosphereOS Debian Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout EchosphereOS
        uses: actions/checkout@v4

      - name: Prepare Debian Trixie environment
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap systemd-container

      - name: Create Debian build environment
        run: |
          sudo debootstrap \
            --variant=minbase \
            trixie \
            /srv/debian \
            http://deb.debian.org/debian

      - name: Install Debian live-build
        run: |
          sudo systemd-nspawn -D /srv/debian apt-get update
          sudo systemd-nspawn -D /srv/debian apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Prepare EchosphereOS configuration
        run: |
          sudo mkdir -p /srv/debian/build/config/package-lists
          echo "task-xfce-desktop live-boot live-config" | \
            sudo tee /srv/debian/build/config/package-lists/echosphere.list.chroot

          sudo chroot /srv/debian /bin/bash -c \
            "cd /build && lb config \
            --distribution trixie \
            --architectures amd64 \
            --binary-image iso-hybrid \
            --archive-areas main"

      - name: Build EchosphereOS
        run: |
          sudo chroot /srv/debian /bin/bash -c \
            "cd /build && lb build"

      - name: Upload EchosphereOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: EchosphereOS-ISO
          path: /srv/debian/build/*.hybrid.iso
          if-no-files-found: error
