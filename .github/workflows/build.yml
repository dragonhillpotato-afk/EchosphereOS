
name: Build EchosphereOS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Get EchosphereOS source
        uses: actions/checkout@v4

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      -       - name: Create EchosphereOS package list
        run: |
          mkdir -p config/package-lists
          cat > config/package-lists/echosphere.list.chroot <<'EOF'
          task-xfce-desktop
          firefox-esr
          network-manager
          linux-image-amd64
          live-boot
          live-config
          live-config-systemd
          sudo
          curl
          git
          EOF
          task-xfce-desktop
          firefox-esr
          network-manager
          linux-image-amd64
          sudo
          curl
          git
          EOF

      - name: Configure Debian
        run: |
          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --linux-packages linux-image \
            --linux-flavours amd64 \
            --initramfs live-boot \
            --binary-image iso-hybrid \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --mirror-chroot-security http://security.debian.org/debian-security/ \
            --mirror-binary-security http://security.debian.org/debian-security/

      - name: Build EchosphereOS
        run: sudo lb build

      - name: Upload EchosphereOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: EchosphereOS-ISO
          path: live-image-amd64.hybrid.iso
          if-no-files-found: error
      - name: Check for Ubuntu packages
        run: |
          grep -Rni casper config/ || true
