
name: EchosphereOS ISO Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            live-build \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools

      - name: Configure EchosphereOS
        run: |
          mkdir -p config/package-lists
          echo "live-boot live-config" > config/package-lists/echosphere.list.chroot

          sudo lb config \
            --distribution trixie \
            --architectures amd64 \
            --mirror-bootstrap http://deb.debian.org/debian/ \
            --mirror-chroot http://deb.debian.org/debian/ \
            --mirror-binary http://deb.debian.org/debian/ \
            --linux-packages linux-image \
            --binary-image iso-hybrid \
            --archive-areas "main"

      - name: Build ISO
        run: sudo lb build

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: EchosphereOS-ISO
          path: "*.hybrid.iso"
          if-no-files-found: error
